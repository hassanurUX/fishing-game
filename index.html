  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + dur + 0.03);

function musicStep(t, s) {
  const fishingNow = state === 'fish', running = state === 'run', calm = !fishingNow && !running;

  if (i === 8) pluck(t, MN(ch[2] - 24), 0.15, 0.3);
  if (i === 12 && !calm) pluck(t, MN(ch[0] - 12), 0.08, 0.15);

  if (strums.includes(i)) ch.forEach((n, k) => pluck(t + k * 0.013, MN(n), 0.03, 0.18));

/* ---------- running ---------- */
const runSpeed = () => Math.min(520, 250 + run.t * 1.6);

function spawnObs() {
  const airOk = run.t > 10, r = Math.random();

    o = Math.random() < 0.5 ? { k: 'jelly', w: 40, h: 56, yb: GY - 34 } : { k: 'puffer', w: 46, h: 42, yb: GY - 36 };

  o.x = W + 60; o.ph = rand(0, 6);

  run.nextObs = o.w + Math.max(340, run.speed * rand(1.1, 1.9));
}
function spawnPearls() {
  const x0 = W + 40, p = Math.random();
  if (p < 0.45) for (let i = 0; i < 5; i++) run.pearls.push({ x: x0 + i * 34, y: GY - 24 });
  else if (p < 0.86) for (let i = 0; i < 6; i++) run.pearls.push({ x: x0 + i * 34, y: GY - 30 - Math.sin(i / 5 * Math.PI) * 90 });

}
const crabBox = () => crab.duck ? [crab.x - 24, crab.y - 30, 52, 28] : [crab.x - 20, crab.y - 50, 62, 46];
const overlap = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];

  const bob = o.k === 'jelly' ? Math.sin(o.ph * 2) * 5 : o.k === 'puffer' ? Math.sin(o.ph * 2.5) * 4 : 0;
  return [o.x + 9, o.yb - o.h + 10 + bob, o.w - 18, o.h - 13];
}
function hurtCrab() {
  // a bump spills every pearl the crab is carrying
  crab.inv = 1.6; shake = 0.4; sfx.hit();
  burst(crab.x + 10, crab.y - 30, 10, '#ffd0a0', 180);
  const lost = run.held;
  if (lost > 0) {
    for (let i = 0; i < Math.min(16, lost); i++) parts.push({ x: crab.x + 10, y: crab.y - 34, vx: rand(-170, 170), vy: rand(-340, -120), r: rand(4, 7), t: 0, max: rand(0.7, 1.1), col: '#fbe9f6' });

function updateRun(dt) {
  run.t += dt;
  if (!run.arriving && run.t >= store.runSecs) startArrive('The drop-off. Time to fish.');
  let sp;
  if (run.arriving) {
    // ease to a stop with the cliff edge exactly where the fishing ledge ends
    const a = run.arrive;
    a.t = Math.min(a.T, a.t + dt);
    const p = a.t / a.T, nd = a.d0 + a.D * (1 - (1 - p) * (1 - p));
    sp = (nd - run.dist) / Math.max(dt, 1e-4);
    run.dist = nd; run.speed = sp;
    if (a.t >= a.T && crab.ground && !run.stopped) { run.stopped = true; run.stopT = 0; crab.duck = false; duckHeld = false; }
  } else {
    run.speed = runSpeed(); sp = run.speed;
    run.dist += sp * dt;
  }
  if (run.stopped) { updateHandover(dt); return; }
  crab.ph += dt * (sp > 1 ? sp * 0.055 : 0);
  crab.inv = Math.max(0, crab.inv - dt);
  if (!crab.ground) {
    if (!jumpHeld && crab.vy < -260) crab.vy = -260;

  }
  run.obs = run.obs.filter(o => o.x > -120);
  for (const p of run.pearls) {
    p.x -= sp * dt;
    if (!p.got && overlap(cb, [p.x - 11, p.y - 11, 22, 22])) {
      p.got = true;
      if (p.gold) { addScore(50); run.held += 10; sfx.gold(); floatText(p.x, p.y - 20, '+10 pearls', '#ffd84a', 24); burst(p.x, p.y, 16, '#ffe680', 180); }
      else { addScore(10); run.held += 1; sfx.pearl(); burst(p.x, p.y, 5, '#ffffff', 90); }
    }

}

  run.arriving = true;

  run.obs = run.obs.filter(o => o.x < crab.x - 30);

/* ---------- scenes ---------- */
function drawRunScene() {
  const off = run.dist;
  drawWater(false); drawRays(off); drawHills(off, GY - 40, false); drawTown(off);
  drawRocks(off); drawKelp(off);
  const ex = run.edgeWorld != null && state === 'run' ? run.edgeWorld - run.dist : null;
  if (ex != null) { ctx.save(); ctx.beginPath(); ctx.rect(-W, -H, ex + W, 3 * H); ctx.clip(); }
  drawSand(off, GY); drawProps(off);
  if (ex != null) ctx.restore();
  if (state === 'run') {
    for (const p of run.pearls) drawPearl(p);
    for (const o of run.obs) drawObstacle(o);
  }
  if (ex != null) drawEdge(ex);
  if (state === 'run' && run.stopped) {
    const g = rodGeom(crab.x, GY);
    drawCrab(crab.x, GY, { sit: true, ph: 0, look: [0.8, 0.6] });
    drawRod(g);
    drawIdleLine(g, g.tx + 10, g.ty + 110);

    const cx = state === 'run' ? crab.x : 170, ducking = state === 'run' && crab.duck;
    drawCrab(cx, state === 'run' ? crab.y : GY, { ph: crab.ph, duck: ducking, air: state === 'run' && !crab.ground, look: [1, crab.ground ? 0 : 0.5], rod: !ducking });
  }

}

  ctx.fillStyle = '#f6e9b8'; ctx.beginPath(); ctx.moveTo(ex - 60, GY - 2); ctx.lineTo(ex - 8, GY - 4); ctx.lineTo(ex - 4, GY + 4); ctx.lineTo(ex - 60, GY + 8); ctx.fill();

function drawFishScene() {
  const off = time * 10;
  drawWater(true); drawRays(off); drawHills(off, H - 70, true);
  ctx.fillStyle = '#d9cc8f'; ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(CLIFF_X, H); for (let x = CLIFF_X; x <= W; x += 30) ctx.lineTo(x, H - 26 + Math.sin(x * 0.02) * 6); ctx.lineTo(W, H); ctx.fill();
  ctx.globalAlpha = 1;
  drawKelpStalk(W - 70, H + 10, 230, 1, 1); drawKelpStalk(W - 46, H + 10, 170, 2.2, 0.9); drawKelpStalk(560, H + 10, 140, 4, 0.8);

  drawCliff();
  drawBucket(64, LEDGE_Y - 2);
  drawCrab(CRAB_FX, LEDGE_Y - 2, { sit: true, ph: 0, look: [0.8, 0.6] });

    if (e.kind === 'fish') drawFishSprite(e.f, 0, 0, e.w, e.h, e.f.dir, e.gold);
    else if (e.kind === 'jelly') drawJelly(0, 0, 1);
    else if (e.kind === 'grouper') drawGrouper(0, 0, 120, 70, 1, true);
    else if (e.kind === 'chest') drawChest(0, 0, true);
    else if (e.kind === 'bottle') drawBottle(0, 0, 0);

  const cols = 4, cw = 210, ch = 118, gx = 14, gy = 10, x0 = (W - (cols * cw + (cols - 1) * gx)) / 2, y0 = 110;
  JOKES.forEach((j, i) => {
    const x = x0 + (i % cols) * (cw + gx), y = y0 + Math.floor(i / cols) * (ch + gy);
    const got = store.bottles.includes(i);
    const hover = got && mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + ch;
    ctx.fillStyle = got ? (hover ? 'rgba(255,252,236,1)' : 'rgba(255,248,225,0.92)') : 'rgba(255,255,255,0.16)'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 14); ctx.fill(); ctx.stroke();
    ctx.save(); if (!got) ctx.globalAlpha = 0.3; ctx.translate(x + 54, y + ch / 2 + Math.sin(time * 2 + i) * 3); ctx.scale(1.4, 1.4); drawBottle(0, 0, -0.3); ctx.restore();
    ctx.font = '16px ' + DISPLAY; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = got ? INK : '#ffffff';
    ctx.fillText('Message ' + (i + 1), x + 104, y + 46);
    ctx.font = '12px ' + FONT; ctx.fillStyle = got ? '#5a6b80' : '#cfefff';
    ctx.fillText(got ? 'Tap to read' : 'Not found yet', x + 104, y + 68);
    if (got) ui.push({ x, y, w: cw, h: ch, on: () => { detail = 'joke:' + i; detailT = time; } });
  });
  if (detail && detail.startsWith('joke:')) {
    const j = JOKES[+detail.slice(5)];
    ui = [{ x: 0, y: 0, w: W, h: H, on: () => { detail = null; } }];
    ctx.fillStyle = 'rgba(0,30,60,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, 292); ctx.rotate(-0.02);
    ctx.fillStyle = '#fff3d6'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-270, -130, 540, 260, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,110,60,0.25)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-230, -70 + i * 34); ctx.lineTo(230, -70 + i * 34); ctx.stroke(); }
    ctx.restore();
    ctx.font = '12px ' + DISPLAY; ctx.fillStyle = '#a0662e'; ctx.textAlign = 'center'; ctx.fillText('A MESSAGE IN A BOTTLE', W / 2, 186);
    const n = plainWrap(j[0], W / 2, 232, 460, 30, 24, '#3a2a1a');
    if (time - detailT > 1.2) plainWrap(j[1], W / 2, 250 + n * 30, 460, 34, 30, '#d0631a');
    else { ctx.font = '26px ' + DISPLAY; ctx.fillStyle = '#c9a77a'; ctx.fillText('. . .', W / 2, 256 + n * 30); }
    ctx.font = '12px ' + FONT; ctx.fillStyle = '#7a6040'; ctx.fillText('Tap anywhere to close', W / 2, 404);
  }
}
function owns(id) { return id === 'reel:fast' ? store.fastReel : store.owned.includes(id); }
function shopClick(item) {
  const [type, val] = item.id.split(':');
  if (!owns(item.id)) {
    if (store.pearls < item.price) { sfx.nope(); toast = { s: 'Not enough pearls yet', t: 0 }; return; }
    store.pearls -= item.price; sfx.buy();
    if (item.id === 'reel:fast') { store.fastReel = true; toast = { s: 'Speedy reel fitted', t: 0 }; persist(); return; }
    store.owned.push(item.id);
    toast = { s: item.name + ' bought', t: 0 };
  }
  if (type === 'shell') store.shell = val;
  if (type === 'hat') store.hat = val;
  persist();
}
function drawShop() {
  txt('Pearls come from fish, chests, missions and safe runs. A bump on the run spills what you carry.', W / 2, 92, 15, '#ffffff', 'center', FONT);
  const cols = 4, cw = 210, ch = 132, gx = 14, x0 = (W - (cols * cw + (cols - 1) * gx)) / 2, y0 = 112;
  SHOP.forEach((item, i) => {
    const x = x0 + (i % cols) * (cw + gx), y = y0 + Math.floor(i / cols) * (ch + 10);
    const [type, val] = item.id.split(':');
    const own = owns(item.id), worn = (type === 'shell' && store.shell === val) || (type === 'hat' && store.hat === val) || (item.id === 'reel:fast' && own);
    ctx.fillStyle = worn ? 'rgba(200,255,220,0.92)' : 'rgba(255,255,255,0.88)'; ctx.strokeStyle = worn ? '#2fae5a' : INK; ctx.lineWidth = worn ? 4 : 2.5;
    ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 14); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(x + 58, y + 82);
    if (type === 'shell') drawShell(0, -20, 0.95, val);
    else if (type === 'hat') { drawShell(0, -10, 0.7, store.shell); drawHat(val, 0, -30, 1.3); if (val === 'none') txt('-', 0, -36, 20, '#ffffff'); }
    else { ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.fillStyle = '#9fd0ff'; ctx.beginPath(); ctx.arc(0, -24, 22, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, -24, 8, 0, TAU); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(16, -40); ctx.stroke(); }
    ctx.restore();
    ctx.font = '15px ' + DISPLAY; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = INK;
    ctx.fillText(item.name, x + 104, y + 30);
    ctx.font = '13px ' + FONT; ctx.fillStyle = '#4a5a70';
    ctx.fillText(own ? (worn ? (item.id === 'reel:fast' ? 'Fitted' : 'Wearing') : 'Owned') : item.price + ' pearls', x + 104, y + 52);
    if (!(item.id === 'reel:fast' && own) && !worn) {
      button(x + 104, y + 74, 92, 40, own ? 'Wear' : 'Buy', own ? 'teal' : store.pearls >= item.price ? 'yellow' : 'grey', () => shopClick(item), { size: 17 });
    }
  });
  if (toast) { ctx.save(); ctx.globalAlpha = clamp((1.8 - toast.t) * 3, 0, 1); panel(W / 2 - 160, H - 70, 320, 46, 0.9); txt(toast.s, W / 2, H - 47, 18, '#fff3a6'); ctx.restore(); }
}

/* ---------- draw ---------- */
function draw() {
  ui = [];
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  if (state === 'aquarium') drawAquariumScreen();
  else if (state === 'fish') {
    if (F.intro > 0) {
      // camera pulls back from the crab to reveal the whole fishing spot
      const e = ease(1 - F.intro / 1.6), z = lerp(ZOOM, 1, e);
      ctx.save(); ctx.translate(lerp(crab.x, CRAB_FX, e), lerp(GY, LEDGE_Y - 2, e)); ctx.scale(z, z); ctx.translate(-CRAB_FX, -(LEDGE_Y - 2));
      drawFishScene(); ctx.restore();
    } else drawFishScene();
  } else if (state === 'run' && run.stopped) {
    // the crab sits at the edge, then the view glides until it is exactly where it fishes from
    const st = run.stopT, e = ease(clamp((st - 0.4) / 1.5, 0, 1)), a = clamp((st - 0.4) / 0.6, 0, 1);
    const sx = lerp(crab.x, CRAB_FX, e), sy = lerp(GY, LEDGE_Y - 2, e);
    if (run.fishReady) { ctx.save(); ctx.translate(sx - CRAB_FX, sy - (LEDGE_Y - 2)); drawFishScene(); ctx.restore(); }
    if (a <= 0 || !run.fishReady) { ctx.save(); ctx.translate(sx - crab.x, sy - GY); drawRunScene(); ctx.restore(); }
    else if (a < 1) {
      if (layer.width !== cv.width || layer.height !== cv.height) { layer.width = cv.width; layer.height = cv.height; }
      const main = ctx; ctx = lctx;
      ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); ctx.clearRect(0, 0, W, H);
      ctx.translate(sx - crab.x, sy - GY); drawRunScene();
      ctx = main;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 - a; ctx.drawImage(layer, 0, 0); ctx.restore();
    }
  } else drawRunScene();
  for (const p of parts) {
    const a = 1 - p.t / p.max;
    if (p.col === 'bubble') { ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  }
  for (const t of texts) { ctx.globalAlpha = clamp(1.6 - t.t, 0, 1); txt(t.s, t.x, t.y, t.size, t.col); ctx.globalAlpha = 1; }
  ctx.restore();

  if (state === 'run' && !run.stopped) drawRunHUD();
  else if (state === 'fish' && F.intro <= 0.2) drawFishHUD();
  else if (state === 'title') drawTitle();
  else if (state === 'settings') drawSettings();
  if (paused) {
    ui = [];
    ctx.fillStyle = 'rgba(0,30,60,0.5)'; ctx.fillRect(0, 0, W, H);
    chunky('Paused.', W / 2, H / 2 - 20, 60, '#ffffff', '#cfefff');
    txt('Tap or press P to carry on', W / 2, H / 2 + 36, 18, '#ffffff');
  }
  if (wipe) { ui = []; drawWipe(); }
}

/* ---------- loop ---------- */
let last = performance.now();
function drawRotate() {
  ctx.fillStyle = '#08385a'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2 - 40); ctx.rotate(-Math.PI / 2 * clamp((Math.sin(time * 2) + 1) / 2 * 1.4, 0, 1));
  ctx.fillStyle = '#9ff4ff'; ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect(-46, -80, 92, 160, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1b8fc2'; ctx.fillRect(-36, -64, 72, 120);
  ctx.restore();
  chunky('Turn your phone sideways.', W / 2, H / 2 + 90, 34, '#fff36b', '#ff9a2e');
  txt('Hermit\'s Catch plays in landscape.', W / 2, H / 2 + 132, 18, '#ffffff', 'center', FONT);
}
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (isPortrait()) { time += dt; drawRotate(); requestAnimationFrame(frame); return; }
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook (harmless in normal play)
window.__hc = { get state() { return state; }, set state(v) { state = v; }, get tab() { return tab; }, set tab(v) { tab = v; }, run, F, crab, store, beginFish, beginRun, startPlay, openAquarium, goTitle, awardCatch, makeFish, spawnPower, spawnSpecial, meet, tugFail, get hearts() { return hearts; }, set hearts(v) { hearts = v; }, get score() { return score; }, get ui() { return ui; } };
})();
</script>
